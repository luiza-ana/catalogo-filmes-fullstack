<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Filmes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <h1 class="mb-4">
      🎬 Catálogo de Filmes
    </h1>

    <div id="alerta" class="alert alert-danger d-none"></div>

    <div class="row">

      <!-- FILMES -->
      <section class="col-lg-6 mb-4">

        <div class="card">

          <div class="card-header">
            Filmes
          </div>

          <div class="card-body">

            <form id="form-filme">

              <input
                type="text"
                id="titulo"
                class="form-control mb-2"
                placeholder="Título"
                required>

              <input
                type="text"
                id="genero"
                class="form-control mb-2"
                placeholder="Gênero"
                required>

              <input
                type="number"
                id="ano"
                class="form-control mb-2"
                placeholder="Ano"
                required>

              <textarea
                id="descricao"
                class="form-control mb-2"
                placeholder="Descrição">
              </textarea>

              <button
                type="submit"
                class="btn btn-primary w-100">
                Adicionar Filme
              </button>

            </form>

            <hr>

            <ul id="lista-filmes" class="list-group"></ul>

          </div>

        </div>

      </section>

      <!-- FAVORITOS -->
      <section class="col-lg-6">

        <div class="card">

          <div class="card-header">
            Favoritos
          </div>

          <div class="card-body">

            <form id="form-favorito">

              <select
                id="conteudoId"
                class="form-select mb-2"
                required>

                <option value="">
                  Selecione um filme
                </option>

              </select>

              <button
                type="submit"
                class="btn btn-success w-100">
                Adicionar aos Favoritos
              </button>

            </form>

            <hr>

            <ul id="lista-favoritos" class="list-group"></ul>

          </div>

        </div>

      </section>

    </div>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
